plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.bit128'
version = '1.0.0'

android {
  namespace "expo.modules.comicarchive"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // libarchive for Android: reads ZIP, RAR (v4 and v5), 7z and tar.
  implementation "me.zhanghai.android.libarchive:library:1.1.4"
}
