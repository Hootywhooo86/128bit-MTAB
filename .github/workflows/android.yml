# Builds the Android APK on every push that touches the app, and publishes it as a
# GitHub Release (with the APK attached) so it can be downloaded straight to a phone.
# Run it by hand from the Actions tab with "Run workflow".
name: Android APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Two APKs from the same code: the phone app, and "128bitPlay TV" for Android TV
    # (Shows, Movies, Anime and Live TV only; its own package so both can be installed).
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: phone
            tv: '0'
            prefix: 128bit
            # Phones are arm64.
            abis: arm64-v8a
          - variant: tv
            tv: '1'
            prefix: 128bit-tv
            # Many TV boxes/sticks (Chromecast, Fire TV) run 32-bit apps, so both.
            abis: armeabi-v7a,arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.apk.outputs.version }}
    defaults:
      run:
        working-directory: app
    env:
      NODE_ENV: production
      EXPO_TV: ${{ matrix.tv }}
      EXPO_PUBLIC_TV: ${{ matrix.tv }}
      # Optional: your Supabase project (Settings → Account), baked in so you don't paste it on each device.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Optional: add these as repository secrets to turn on Trakt in the build.
      EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      EXPO_PUBLIC_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      # Lets the app's "Check for updates" compare itself with the newest release.
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK parts this app needs
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Install dependencies
        run: npm ci

      # Small native tweaks to libraries (e.g. lock-screen chapter buttons), kept in app/patches.
      - name: Apply native patches
        run: for p in patches/*.patch; do patch -p1 --forward < "$p"; done

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (${{ matrix.variant }})
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ matrix.abis }}

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="${{ matrix.prefix }}-${version}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/${{ steps.apk.outputs.name }}

  # Both APKs on one release, once both builds are done.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-build${{ github.run_number }}
          name: 128bit ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: apks/*.apk
          body: |
            **Phone:** `128bit-…apk` (arm64 phones, Android 7+). **Android TV:** `128bit-tv-…apk` ("128bitPlay TV": Shows, Movies, Anime, Live TV). Built from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install:** open this page on your phone, tap the `.apk` under Assets, then open the download and tap Install.
            Builds are signed with the same key, so new ones install over the old one and keep your settings.
